<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Karigor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1116'/%3E%3Cpath d='M9 23V9h3v6l6-6h4l-7 7 7 7h-4l-6-6v6z' fill='white'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eef0f3;
  --text: #0e1116;
  --muted: #545b66;
  --line: #e3e5e9;
  --accent: #3442d9;
  --accent-text: #ffffff;
  --accent-soft: #eceefe;
  --ok: #0b6b3f;
  --ok-soft: #e7f4ec;
  --warn: #8a5300;
  --warn-soft: #fbf0dc;
  --bad: #b3261e;
  --bad-soft: #fbe3e1;
  --mine: #0e1116;
  --mine-text: #ffffff;
  --shadow: 0 1px 2px rgba(14, 17, 22, .05), 0 4px 16px rgba(14, 17, 22, .05);
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116;
    --surface: #161a22;
    --surface-2: #1f2430;
    --text: #e8e9ec;
    --muted: #a3a9b4;
    --line: #2a2f3a;
    --accent: #a9b1ff;
    --accent-text: #0e1116;
    --accent-soft: #232a55;
    --ok: #5be0a0;
    --ok-soft: #12301f;
    --warn: #ffb86b;
    --warn-soft: #3a2a14;
    --bad: #f28b82;
    --bad-soft: #3d1d1b;
    --mine: #e8e9ec;
    --mine-text: #0e1116;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a22; --surface-2: #1f2430; --text: #e8e9ec; --muted: #a3a9b4; --line: #2a2f3a;
  --accent: #a9b1ff; --accent-text: #0e1116; --accent-soft: #232a55; --ok: #5be0a0; --ok-soft: #12301f;
  --warn: #ffb86b; --warn-soft: #3a2a14; --bad: #f28b82; --bad-soft: #3d1d1b; --mine: #e8e9ec; --mine-text: #0e1116; --shadow: none;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Bengali", "Nirmala UI", "Bangla Sangam MN", sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

header {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.mark { width: 28px; height: 28px; border-radius: 8px; background: var(--mine); color: var(--mine-text); display: grid; place-items: center; font-size: 15px; font-weight: 800; }
.title { flex: 1; min-width: 0; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; border: 0; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; height: 36px; padding: 0 12px; font-size: 14px; }

main { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 12px; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: 14px; }

.msg { display: flex; flex-direction: column; max-width: 88%; gap: 6px; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg.them { align-self: flex-start; align-items: flex-start; }
.msg.new { animation: rise .35s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.metarow { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.metarow .meta { padding: 0; }
.metarow { padding: 0 6px; }
.bubble { padding: 10px 14px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); overflow-wrap: anywhere; white-space: pre-wrap; }
.me .bubble { background: var(--mine); color: var(--mine-text); border-color: transparent; border-bottom-right-radius: 6px; }
.them .bubble { border-bottom-left-radius: 6px; }
.meta { font-size: 12px; color: var(--muted); padding: 0 6px; }
details.more { font-size: 13px; color: var(--muted); }
.card details.more, .msg > details.more { padding: 0 6px; }
details.more summary { cursor: pointer; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "▸ "; }
details.more[open] summary::before { content: "▾ "; }
details.more ul { margin: 6px 0 0; padding-left: 18px; }
details.more li { margin: 2px 0; overflow-wrap: anywhere; }
li.fail { color: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.card h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.card p { margin: 0; }
.card.result { border-color: var(--ok); background: linear-gradient(var(--ok-soft), var(--surface) 70%); }
.card.problem { border-color: var(--bad); background: var(--bad-soft); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; background: var(--accent); color: var(--accent-text); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
.btn.quiet { background: var(--surface-2); color: var(--text); font-weight: 500; }
.progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
.status { display: flex; align-items: center; gap: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.running { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
.dot.finished { background: var(--ok); }
.dot.stopped { background: var(--bad); }
@keyframes pulse { 50% { opacity: .35; } }
.typing .bubble { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s ease-in-out infinite; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.steps li { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); min-width: 0; }
.steps li::before { content: ""; height: 4px; border-radius: 999px; background: var(--surface-2); }
.steps li.done::before { background: var(--accent); }
.steps li.now, .steps li.at { color: var(--text); font-weight: 600; }
.steps li.at::before { background: linear-gradient(90deg, var(--accent) 0 50%, var(--surface-2) 50% 100%); }
.steps li.now::before { background: linear-gradient(90deg, var(--accent) 0 50%, var(--surface-2) 50% 100%); background-size: 200% 100%; animation: fill 1.6s linear infinite; }
@keyframes fill { from { background-position: 100% 0; } to { background-position: 0 0; } }
.how { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 560px; text-align: left; }
.how li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.how b { color: var(--text); font-size: 14px; }
.how .n { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
@media (max-width: 520px) { .how { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .dot.running, .msg.new, .typing i, .steps li.now::before { animation: none; } .progress > div { transition: none; } }

.decisions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.decisions li { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.decisions .topic { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.decisions .was { text-decoration: line-through; color: var(--muted); font-size: 14px; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-size: 14px; align-self: flex-start; }
.inline-form { display: flex; gap: 6px; }
.inline-form input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); }

.welcome { text-align: center; padding: 40px 8px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.welcome h1 { margin: 0; font-size: clamp(26px, 6vw, 34px); letter-spacing: -.02em; line-height: 1.15; }
.welcome p { margin: 0; color: var(--muted); max-width: 30em; }
.examples { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 480px; margin-top: 8px; }
.examples button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; transition: border-color .15s, transform .15s; }
.examples button:hover { border-color: var(--accent); transform: translateY(-1px); }
.starters { width: 100%; max-width: 560px; margin-top: 20px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.starters h2 { margin: 0; font-size: 15px; }
.starters > p { font-size: 13px; padding: 0; }
.sgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sgrid button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; transition: border-color .15s, transform .15s; }
.sgrid button:hover { border-color: var(--accent); transform: translateY(-1px); }
.sgrid button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.sgrid b { font-size: 14px; }
.sgrid span { font-size: 12px; color: var(--muted); }
@media (max-width: 420px) { .sgrid { grid-template-columns: 1fr; } }
.picked { max-width: 720px; margin: 0 auto 8px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 14px; padding: 8px 12px; font-size: 14px; }
.picked .top { display: flex; gap: 10px; align-items: center; }
.picked .what { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.picked .what .meta { padding: 0; }
.picked p { margin: 6px 0 2px; font-size: 13px; color: var(--muted); max-height: 30vh; overflow: auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

footer { position: sticky; bottom: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.composer { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 11px 14px; max-height: 40vh; min-height: 46px; outline: none; }
.composer textarea:focus { border-color: var(--accent); }
.composer .btn { border-radius: 16px; min-width: 64px; justify-content: center; }
.composer .btn:disabled { opacity: .5; cursor: default; }
.hint { max-width: 720px; margin: 6px auto 0; font-size: 12px; color: var(--muted); min-height: 1em; }

dialog { border: 0; border-radius: 20px; padding: 0; width: min(520px, calc(100% - 32px)); background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(0,0,0,.35); }
.sheet { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { margin: 0; font-size: 18px; }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 55vh; overflow: auto; }
.plist button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.plist .idea { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.field input { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark" aria-hidden="true">K</div><span>Karigor</span></div>
  <div class="title" id="title"></div>
  <button class="chip" id="cost" hidden></button>
  <button class="iconbtn" id="langBtn" type="button" lang="bn">বাংলা</button>
  <button class="iconbtn" id="projectsBtn" aria-haspopup="dialog">Projects</button>
</header>

<main id="main" aria-live="polite"></main>

<footer>
  <div class="picked" id="picked" hidden></div>
  <form class="composer" id="composer">
    <label for="input" class="sr">Message</label>
    <textarea id="input" rows="1" placeholder="Describe your idea…"></textarea>
    <button class="btn" id="send" type="submit">Send</button>
  </form>
  <div class="hint" id="hint"></div>
</footer>

<dialog id="projects">
  <div class="sheet">
    <h2 id="projectsTitle">Your projects</h2>
    <ul class="plist" id="plist"></ul>
    <div class="row">
      <button class="btn" id="newBtn">New idea</button>
      <button class="btn quiet" id="keyBtn" hidden>Your key</button>
      <button class="btn quiet" id="closeBtn">Close</button>
    </div>
  </div>
</dialog>

<dialog id="keyDialog">
  <form class="sheet" method="dialog" id="keyForm">
    <h2 id="keyTitle">Your Anthropic key</h2>
    <p id="keyText" style="margin:0;color:var(--muted);font-size:14px">This Karigor uses your own key. It stays in this browser tab and is sent only with the requests that need it; it is never saved on the server.</p>
    <label class="field" id="keyLabel">Key <input id="keyInput" type="password" autocomplete="off" placeholder="sk-ant-…"></label>
    <div class="row"><button class="btn" value="save" id="keySave">Save</button><button class="btn quiet" value="cancel" id="keyCancel">Cancel</button></div>
  </form>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const main = $("main"), input = $("input"), send = $("send"), hint = $("hint");
  let config = { demo: false, needsKey: false };
  let current = null; // project id
  let view = null;
  let stream = null;
  let justCreated = null; // a project this tab just started: its first messages slide in too
  let shown = -1; // messages already on screen for this project; -1 until the first view arrives
  let starters = null; // the ready-made ideas, loaded once
  let picked = null; // the ready-made idea a new project starts from
  let allStarters = false;

  const store = {
    get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch {} },
  };

  // ---- language: English or Bangla, remembered in this browser; what the agents wrote is shown as written ----
  const WORDS = {
    en: {
      message: "Message", ideaPh: "Describe your idea…", fixPh: "Something to fix or add?", changesPh: "What is different for you? (optional)",
      send: "Send", build: "Build", projects: "Projects", yourProjects: "Your projects", newIdea: "New idea", yourKey: "Your key", close: "Close",
      keyTitle: "Your Anthropic key", keyText: "This Karigor uses your own key. It stays in this browser tab and is sent only with the requests that need it; it is never saved on the server.",
      key: "Key", save: "Save", cancel: "Cancel", otherLang: "বাংলা", otherLangName: "Switch to Bangla",
      wrong: (s) => `Something went wrong (${s})`, noExtra: "No extra cost", free: "Free", costOf: (c, s, b) => `${c} ${s} of ${b}`,
      demoLong: "Demo mode: the steps are real, the work is pretend. Nothing is actually built or put online.", demoShort: "Demo mode: the steps are real, the work is pretend.",
      steps: (n) => `${n} step${n === 1 ? "" : "s"}`, working: "Working", inTheWay: "Something got in the way", tryAgain: "Try again",
      piecesDone: (d, t, p) => `${d} of ${t} pieces done${p ? `, ${p} set aside` : ""}`, setAside: "Set aside for now", toHandle: (n) => `Waiting to be handled (${n})`,
      stepLabels: ["Spec", "Design", "Plan", "Build", "Release"], progressLabel: "Progress through the process",
      howToUse: "How to use it: ", openIt: "Open it", planParts: "The plan, part by part", partState: { built: "Built", building: "Being built", later: "Later" },
      buildNext: (n) => `Build the next part: ${n}`, tryFirst: "Try what is there first; you can still send fixes.", writeBelow: "Something not right, or something to add? Write it below and a fix round starts on its own.",
      buildingNext: (s) => `Building the next part: ${s}.`,
      needsBefore: "Built. It needs a few things from you before it goes online", needsLive: "Online, but it needs a few things from you",

      notRight: "Not right?", shouldBe: "What should it be?", correct: (t) => `Correct: ${t}`, fix: "Fix", fixStarted: "Thanks. A fix round has started to apply it.", willFollow: "Thanks. Every step from now on will follow it.",
      decisions: (n) => `Decisions made for you (${n})`, notAsked: "You were not asked anything technical. If one of these is wrong for you, say so.",
      examples: ["A site where neighbours on my street lend each other tools", "A booking page for my tailoring shop, with reminders", "A simple tracker for my tuition students and their fees"],
      hello: "Tell me your idea. I'll build it, put it online, and keep it working.", helloText: "No technical questions. Describe what you want in your own words; I decide the rest and show you every decision so you can change it.",
      how: "How it works", how1: ["You describe it", "In your own words, once."], how2: ["Karigor builds it", "Every step is checked: tests, reviews, a security scan."], how3: ["It goes live", "And stays working: problems become fixes."],
      startersTitle: "Or start from a ready-made idea", startersText: "Common needs in Bangladesh, written out in full. Pick one, then tell me what is different for you.",
      forWhom: (f) => `For ${f}`, fewer: "Show fewer", showAll: (n) => `Show all ${n}`, startingFrom: "Starting from ", addOrSend: "Add what is different for you, or send as it is.",
      readIt: "Read it", hide: "Hide", remove: "Remove", removeX: (t) => `Remove ${t}`, modelledOn: (x) => `Modelled on ${x}.`,
      fixRound: "Thanks. A fix round has started.", onList: "Thanks. It's on the list for the next fix round.", already: "That's already on the list.", tryingAgain: "Trying again.",
      cantLoad: "Could not load that project.", loading: "Loading…", noProjects: "No projects yet.", cantReach: "Can't reach Karigor",
      tierNames: { free: "free", cheap: "cheap", best: "best" },
      costHint: (tier, c, s, b, api) => `${tier} tier: spent ${c} ${s} of ${b}${api ? ` (covered by a subscription; about ${c} ${api} at API prices)` : ""}.`,
    },
    bn: {

      send: "পাঠান", build: "তৈরি করুন", projects: "প্রকল্প", yourProjects: "আপনার প্রকল্পগুলো", newIdea: "নতুন আইডিয়া", yourKey: "আপনার কী", close: "বন্ধ করুন",
      keyTitle: "আপনার Anthropic কী", keyText: "এই Karigor আপনার নিজের কী ব্যবহার করে। কী-টি এই ব্রাউজার ট্যাবেই থাকে, শুধু যে অনুরোধগুলোর দরকার সেগুলোর সঙ্গে পাঠানো হয়, আর সার্ভারে কখনো রাখা হয় না।",

    for (const d of view.decisions) {
      const li = el("li", {},
        el("span", { class: "topic" }, d.topic),
        d.correctedTo ? el("span", {}, d.correctedTo) : el("span", {}, d.decision),
        d.correctedTo ? el("span", { class: "was" }, d.decision) : null,
      );
      if (!d.correctedTo) {
        const btn = el("button", { class: "linkbtn", type: "button" }, t("notRight"));
        btn.addEventListener("click", () => {
          const field = el("input", { placeholder: t("shouldBe"), "aria-label": t("correct", d.topic) });
          const form = el("form", { class: "inline-form" }, field, el("button", { class: "btn" }, t("fix")));
          form.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!field.value.trim()) return;
            try {
              const r = await api(`/api/projects/${current}/corrections`, { method: "POST", body: JSON.stringify(withKey({ decisionId: d.id, text: field.value })) });
              hint.textContent = r.fixing ? t("fixStarted") : t("willFollow");
            } catch (err) { hint.textContent = err.message; }
          });
          btn.replaceWith(form);
          field.focus();
        });
        li.append(btn);
      }
      list.append(li);
    }
    return el("details", { class: "card" }, el("summary", { style: "cursor:pointer;font-weight:600" }, t("decisions", view.decisions.length)), el("p", { class: "meta" }, t("notAsked")), list);
  }

  function renderWelcome() {
    $("title").textContent = "";
    $("cost").hidden = true;
    const ideas = t("examples");
    main.append(
      config.demo ? el("div", { class: "banner" }, t("demoShort")) : null,
      el("div", { class: "welcome" },
        el("h1", {}, t("hello")),
        el("p", {}, t("helloText")),
        el("div", { class: "examples" }, ideas.map((t) => el("button", { type: "button", onclick: () => { input.value = t; input.focus(); grow(); } }, t))),
        el("ol", { class: "how", "aria-label": t("how") },
          el("li", {}, el("span", { class: "n" }, "1"), el("b", {}, t("how1")[0]), t("how1")[1]),
          el("li", {}, el("span", { class: "n" }, "2"), el("b", {}, t("how2")[0]), t("how2")[1]),
          el("li", {}, el("span", { class: "n" }, "3"), el("b", {}, t("how3")[0]), t("how3")[1])),
        startersSection(),
      ),
    );
  }

  // ---- ready-made ideas: pick one, then say what is different for you ----
  function startersSection() {
    const box = el("section", { class: "starters", "aria-labelledby": "startersTitle" });
    const fill = () => {
      if (!starters || !starters.length) return box.replaceChildren();
      const list = allStarters ? starters : starters.slice(0, 6);
      box.replaceChildren(
        el("h2", { id: "startersTitle" }, t("startersTitle")),
        el("p", { class: "meta" }, t("startersText")),
        el("div", { class: "sgrid" }, list.map((s) => el("button", { type: "button", "aria-pressed": picked && picked.id === s.id ? "true" : "false", "data-starter": s.id, onclick: () => pick(s) }, el("b", {}, sw(s, "title")), el("span", {}, t("forWhom", sw(s, "for")))))),
        starters.length > 6 ? el("button", { type: "button", class: "linkbtn", onclick: () => { allStarters = !allStarters; fill(); } }, allStarters ? t("fewer") : t("showAll", starters.length)) : null,
      );
    };
    if (starters) fill();
    else api("/api/starters").then((r) => { starters = r.starters; fill(); }).catch(() => { starters = []; });
    return box;
  }

  function pick(s) {
    picked = s;
    showPicked();
    input.focus();
  }
  function showPicked() {
    const box = $("picked");
    const on = !!(picked && !current);
    box.hidden = !on;
    for (const b of document.querySelectorAll("[data-starter]")) b.setAttribute("aria-pressed", String(on && b.dataset.starter === picked.id));
    input.placeholder = current ? t("fixPh") : on ? t("changesPh") : t("ideaPh");
    if (!on) return box.replaceChildren();
    const full = el("p", { hidden: true }, sw(picked, "idea"), el("br"), el("br"), t("modelledOn", picked.basedOn.join(", ")));
    box.replaceChildren(
      el("div", { class: "top" },
        el("span", { class: "what" }, el("span", {}, t("startingFrom"), el("b", {}, sw(picked, "title"))), el("span", { class: "meta" }, t("addOrSend"))),
        el("button", { type: "button", class: "linkbtn", onclick: (e) => { full.hidden = !full.hidden; e.target.textContent = full.hidden ? t("readIt") : t("hide"); } }, t("readIt")),
        el("button", { type: "button", class: "linkbtn", "aria-label": t("removeX", sw(picked, "title")), onclick: () => { picked = null; showPicked(); input.focus(); } }, t("remove"))),
      full,
    );
  }

  // ---- actions ----
  async function submit(e) {
    e.preventDefault();
    const text = input.value.trim();
    const starter = !current && picked ? picked.id : null;
    if (!text && !starter) return;
    if (config.needsKey && !store.get("karigor_key")) { $("keyDialog").showModal(); return; }
    send.disabled = true;
    try {
      if (!current) {
        const r = await api("/api/projects", { method: "POST", body: JSON.stringify(withKey(starter ? { starter, idea: text, lang } : { idea: text })) });
        input.value = "";
        picked = null;
        justCreated = r.projectId;
        location.hash = `#/p/${r.projectId}`;
      } else {
        const r = await api(`/api/projects/${current}/feedback`, { method: "POST", body: JSON.stringify(withKey({ text })) });
        input.value = "";
        hint.textContent = r.fixing ? t("fixRound") : r.workItemId ? t("onList") : t("already");
      }
      grow();
    } catch (err) {
      hint.textContent = err.message;
    } finally {
      send.disabled = false;
    }
  }
  async function resume() {
    try { await api(`/api/projects/${current}/resume`, { method: "POST", body: JSON.stringify(withKey({})) }); hint.textContent = t("tryingAgain"); }
    catch (err) { hint.textContent = err.message; }
  }

  function open(id) {
    if (stream) { stream.close(); stream = null; }
    current = id;
    view = null;
    shown = justCreated === id ? 0 : -1;
    justCreated = null;
    hint.textContent = "";
    showPicked();
    send.textContent = id ? t("send") : t("build");
    render();
    if (!id) return;
    stream = new EventSource(`/api/projects/${id}/stream?lang=${lang}`);
    stream.onmessage = (ev) => { view = JSON.parse(ev.data); render(); };
    stream.onerror = () => { hint.textContent = view ? "" : t("cantLoad"); };
  }
  const route = () => { const m = /^#\/p\/([a-z0-9-]+)$/.exec(location.hash); open(m ? m[1] : null); };

  async function showProjects() {
    const list = $("plist");
    list.replaceChildren(el("li", { class: "meta" }, t("loading")));
    $("projects").showModal();
    try {
      const { projects } = await api("/api/projects");
      list.replaceChildren(...(projects.length ? projects.map((p) => el("li", {}, el("button", { type: "button", onclick: () => { $("projects").close(); location.hash = `#/p/${p.id}`; } }, el("span", { class: `dot ${p.running ? "running" : p.status}` }), el("span", { class: "idea" }, p.idea || p.id)))) : [el("li", { class: "meta" }, t("noProjects"))]));
    } catch (err) { list.replaceChildren(el("li", { class: "meta" }, err.message)); }
  }

  function grow() { input.style.height = "auto"; input.style.height = `${Math.min(input.scrollHeight, window.innerHeight * 0.4)}px`; }
  input.addEventListener("input", grow);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(pointer: fine)").matches) { e.preventDefault(); $("composer").requestSubmit(); } });
  $("composer").addEventListener("submit", submit);
  $("projectsBtn").addEventListener("click", showProjects);
  $("closeBtn").addEventListener("click", () => $("projects").close());
  $("newBtn").addEventListener("click", () => { $("projects").close(); location.hash = ""; input.focus(); });
  $("keyBtn").addEventListener("click", () => { $("projects").close(); $("keyDialog").showModal(); });
  $("keyForm").addEventListener("submit", (e) => { if (e.submitter && e.submitter.value === "save") store.set("karigor_key", $("keyInput").value.trim()); });
  $("cost").addEventListener("click", () => { if (view && view.cost) hint.textContent = t("costHint", t("tierNames")[view.cost.tier] ?? view.cost.tier, view.cost.currency, view.cost.spent.toFixed(4), view.cost.budget.toFixed(2), view.cost.apiEquivalent ? view.cost.apiEquivalent.toFixed(2) : ""); });
  $("langBtn").addEventListener("click", () => {
    lang = lang === "bn" ? "en" : "bn";
    prefs.set(lang);
    applyStatic();
    shown = -1;
    open(current);
  });
  applyStatic();
  window.addEventListener("hashchange", route);

  api("/api/config").then((c) => { config = c; $("keyBtn").hidden = !c.needsKey; route(); }).catch((err) => { main.replaceChildren(el("div", { class: "card problem" }, el("h2", {}, t("cantReach")), el("p", {}, err.message))); });
})();
</script>
</body>
</html>
