<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome</title>
  <meta name="description" content="A new site, being made.">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap row">
      <a class="brand" href="/">Welcome</a>
      <nav aria-label="Main">
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <h1>A new site, being made</h1>
        <p class="lead">This page is replaced with the real one as the site is built.</p>
        <p><a class="btn" href="#contact">Get in touch</a></p>
      </div>
    </section>

    <section id="about" class="band">
      <div class="wrap">
        <h2>About</h2>
        <p>What this is, who it is for, and why it matters.</p>
      </div>
    </section>

    <section id="contact">
      <div class="wrap">
        <h2>Contact</h2>
        <p>How to reach us.</p>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap"><p>&copy; <span data-year></span></p></div>
  </footer>
  <script src="/site.js" defer></script>
</body>
</html>
